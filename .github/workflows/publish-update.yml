name: Publish SheV Agent update

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows:
      - "SheV Agent Android"
    branches:
      - "main"
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag must match app version, for example v0.3.1"
        required: true
        default: "v0.3.1"
permissions:
  contents: write

concurrency:
  group: shev-agent-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish installable APK
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shev-agent-debug-keystore-v1

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Allocate next Android versionCode
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts").read_text()
          configured = re.search(r"getOrElse\((\d+)\)", gradle_file)
          if not configured:
              raise SystemExit("Cannot read the baseline versionCode from app/build.gradle.kts")
          baseline = int(configured.group(1))

          raw = subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=100"],
              text=True,
          )
          releases = [
              item for item in json.loads(raw)
              if not item.get("draft") and not item.get("prerelease")
          ]
          if not releases:
              raise SystemExit("No published release found; refusing to guess the previous versionCode.")

          releases.sort(key=lambda item: item.get("published_at") or item.get("created_at") or "", reverse=True)
          latest = releases[0]
          match = re.search(r"(?im)^versionCode:\s*(\d+)\s*$", latest.get("body") or "")
          if not match:
              raise SystemExit(
                  f"Latest release {latest.get('tag_name')} has no versionCode in its release notes; "
                  "refusing to publish an APK with an unverified versionCode."
              )

          previous = int(match.group(1))
          next_code = max(baseline, previous) + 1
          if next_code > 2_100_000_000:
              raise SystemExit("Android versionCode limit reached.")

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"APP_VERSION_CODE={next_code}\n")
              env.write(f"PREVIOUS_VERSION_CODE={previous}\n")
          print(f"Previous published versionCode: {previous}")
          print(f"Allocated versionCode: {next_code}")
          PY

      - name: Verify release tag matches app version
        working-directory: android
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            RELEASE_TAG="v$VERSION"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          test "v$VERSION" = "$RELEASE_TAG"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Verify existing release tag matches build commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repository = os.environ["GITHUB_REPOSITORY"]
          release_tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_TOKEN"]
          build_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()

          def get_json(path):
              request = urllib.request.Request(
                  f"{api_url}/repos/{repository}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"Cannot verify release tag {release_tag}: HTTP {error.code}: {detail}"
                  )

          encoded_tag = urllib.parse.quote(release_tag, safe="/")
          tag_ref = get_json(f"git/ref/tags/{encoded_tag}")
          if tag_ref is None:
              print(
                  f"Release tag {release_tag} does not exist; it will be created "
                  f"from build commit {build_sha}."
              )
              sys.exit(0)

          target = tag_ref["object"]
          if target["type"] == "tag":
              annotated_tag = get_json(f"git/tags/{target['sha']}")
              if annotated_tag is None:
                  raise SystemExit(f"Cannot resolve annotated tag {release_tag}.")
              target = annotated_tag["object"]

          if target.get("type") != "commit":
              raise SystemExit(
                  f"Release tag {release_tag} does not resolve to a commit."
              )

          tag_sha = target["sha"]
          if tag_sha != build_sha:
              raise SystemExit(
                  f"Refusing to overwrite release {release_tag}: its Git tag points "
                  f"to {tag_sha}, but this APK would be built from {build_sha}. "
                  "Create a new version/tag instead."
              )

          print(f"Verified {release_tag} points to the exact build commit {build_sha}.")
          PY

      - name: Run unit tests
        working-directory: android
        run: gradle -PSHEV_VERSION_CODE="$APP_VERSION_CODE" testDebugUnitTest --stacktrace

      - name: Assemble APK
        working-directory: android
        run: gradle -PSHEV_VERSION_CODE="$APP_VERSION_CODE" assembleDebug

      - name: Verify APK versionCode
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ACTUAL_CODE=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          test -n "$ACTUAL_CODE"
          test "$ACTUAL_CODE" = "$APP_VERSION_CODE"
          test "$ACTUAL_CODE" -gt "$PREVIOUS_VERSION_CODE"
          echo "Verified APK versionCode=$ACTUAL_CODE is greater than previous=$PREVIOUS_VERSION_CODE"

      - name: Prepare release files
        run: |
          mkdir -p release-package
          cp android/app/build/outputs/apk/debug/app-debug.apk release-package/app-debug.apk
          cd release-package
          sha256sum app-debug.apk > app-debug.apk.sha256
          printf 'version=%s\nversionCode=%s\ncommit=%s\n' "$APP_VERSION" "$APP_VERSION_CODE" "$(git -C .. rev-parse HEAD)" > build-info.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SheV Agent ${{ env.APP_VERSION }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          body: |
            SheV Agent Android update ${{ env.APP_VERSION }}.

            versionCode: ${{ env.APP_VERSION_CODE }}

            Previous versionCode: ${{ env.PREVIOUS_VERSION_CODE }}

            Install the attached app-debug.apk from the app's built-in update screen.
          files: |
            release-package/app-debug.apk
            release-package/app-debug.apk.sha256
            release-package/build-info.txt
          fail_on_unmatched_files: true

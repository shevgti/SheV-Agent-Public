name: Publish SheV Agent update

on:
  workflow_run:
    workflows:
      - "SheV Agent Android"
    branches:
      - "main"
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: write
  actions: read

concurrency:
  group: shev-agent-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish installable APK
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: Set up Android SDK and pinned NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;27.2.12479018"

      - name: Download Codex runtime from successful Android build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: codex-app-server-android-arm64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: codex-runtime

      - name: Install Codex-pinned Rust 1.95.0 Android target for standalone release
        if: github.event_name != 'workflow_run'
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt,rust-src
          targets: aarch64-linux-android

      - name: Configure Android linker for standalone release
        if: github.event_name != 'workflow_run'
        shell: bash
        run: |
          rustup target add --toolchain 1.95.0 aarch64-linux-android
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384" >> "$GITHUB_ENV"

      - name: Checkout pinned official Codex source for standalone release
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 82e6bacb9c6950d3b56cb153847fa80bdd698053
          path: codex
          fetch-depth: 1

      - name: Build official Codex runtime for standalone release
        if: github.event_name != 'workflow_run'
        working-directory: codex/codex-rs
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: |
          cargo build --release --target aarch64-linux-android --bin codex-app-server -p codex-app-server
          mkdir -p ../../codex-runtime
          install -m 0755 target/aarch64-linux-android/release/codex-app-server ../../codex-runtime/libcodex_app_server.so
          install -m 0644 "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" ../../codex-runtime/libc++_shared.so

      - name: Embed Codex runtime into APK
        working-directory: android
        run: |
          test -s ../codex-runtime/libcodex_app_server.so
          test -s ../codex-runtime/libc++_shared.so
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -l ../codex-runtime/libcodex_app_server.so | grep -q '0x4000'
          "$READELF" -l ../codex-runtime/libc++_shared.so | grep -q '0x4000'
          mkdir -p app/src/main/jniLibs/arm64-v8a
          install -m 0755 ../codex-runtime/libcodex_app_server.so app/src/main/jniLibs/arm64-v8a/libcodex_app_server.so
          install -m 0644 ../codex-runtime/libc++_shared.so app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          file app/src/main/jniLibs/arm64-v8a/libcodex_app_server.so

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shev-agent-debug-keystore-v1

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Allocate next Android versionCode
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts").read_text()
          configured = re.search(r"getOrElse\((\d+)\)", gradle_file)
          if not configured:
              raise SystemExit("Cannot read the baseline versionCode from app/build.gradle.kts")
          baseline = int(configured.group(1))

          raw = subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=100"],
              text=True,
          )
          releases = [
              item for item in json.loads(raw)
              if not item.get("draft") and not item.get("prerelease")
          ]
          if not releases:
              raise SystemExit("No published release found; refusing to guess the previous versionCode.")

          published_codes = []
          for release in releases:
              match = re.search(r"(?im)^versionCode:\s*(\d+)\s*$", release.get("body") or "")
              if match:
                  published_codes.append(int(match.group(1)))
          if not published_codes:
              raise SystemExit("No published release contains a valid versionCode; refusing to guess.")

          previous = max(published_codes)
          next_code = max(baseline, previous) + 1
          if next_code > 2_100_000_000:
              raise SystemExit("Android versionCode limit reached.")

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"APP_VERSION_CODE={next_code}\n")
              env.write(f"PREVIOUS_VERSION_CODE={previous}\n")
          print(f"Previous published versionCode: {previous}")
          print(f"Allocated versionCode: {next_code}")
          PY

      - name: Allocate unique release tag
        working-directory: android
        run: |
          VERSION=$(grep -oP 'versionName = "\\K[^"]+' app/build.gradle.kts)
          test -n "$VERSION"
          RELEASE_TAG="v${VERSION}-build.${APP_VERSION_CODE}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Publishing ${RELEASE_TAG}"

      - name: Run unit tests
        working-directory: android
        run: gradle -PSHEV_VERSION_CODE="$APP_VERSION_CODE" testDebugUnitTest --stacktrace

      - name: Assemble APK
        working-directory: android
        run: gradle -PSHEV_VERSION_CODE="$APP_VERSION_CODE" assembleDebug

      - name: Verify APK versionCode and embedded Codex runtime
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ACTUAL_CODE=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          test -n "$ACTUAL_CODE"
          test "$ACTUAL_CODE" = "$APP_VERSION_CODE"
          test "$ACTUAL_CODE" -gt "$PREVIOUS_VERSION_CODE"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libcodex_app_server.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libc++_shared.so"
          echo "Verified APK versionCode=$ACTUAL_CODE and embedded ARM64 Codex runtime"

      - name: Prepare release files
        run: |
          mkdir -p release-package
          cp android/app/build/outputs/apk/debug/app-debug.apk release-package/app-debug.apk
          cd release-package
          sha256sum app-debug.apk > app-debug.apk.sha256
          printf 'version=%s\nversionCode=%s\ncommit=%s\n' "$APP_VERSION" "$APP_VERSION_CODE" "$(git -C .. rev-parse HEAD)" > build-info.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SheV Agent ${{ env.APP_VERSION }} (build ${{ env.APP_VERSION_CODE }})
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          body: |
            SheV Agent Android update.

            versionName: ${{ env.APP_VERSION }}

            versionCode: ${{ env.APP_VERSION_CODE }}

            Previous versionCode: ${{ env.PREVIOUS_VERSION_CODE }}

            Install the attached app-debug.apk from the app's built-in update screen.
          files: |
            release-package/app-debug.apk
            release-package/app-debug.apk.sha256
            release-package/build-info.txt
          fail_on_unmatched_files: true

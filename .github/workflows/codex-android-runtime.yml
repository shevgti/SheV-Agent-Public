name: Codex App Server Android cross-build

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/codex-app-server-android-native"
    paths:
      - ".github/workflows/codex-android-runtime.yml"

concurrency:
  group: codex-android-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout SheV Agent
        uses: actions/checkout@v4

      - name: Install Android SDK and pinned NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"

      - name: Install Codex-pinned Rust 1.95.0 Android target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt,rust-src
          targets: aarch64-linux-android

      - name: Ensure Android Rust standard library is installed for Codex toolchain
        shell: bash
        run: |
          rustup target add --toolchain 1.95.0 aarch64-linux-android
          echo "Active Rust toolchain:"
          rustup show active-toolchain
          echo "Installed targets for Rust 1.95.0:"
          rustup target list --installed --toolchain 1.95.0
          rustup target list --installed --toolchain 1.95.0 | grep -Fxq aarch64-linux-android

      - name: Configure Android linker
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "TARGET_AR=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "TARGET_RANLIB=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384" >> "$GITHUB_ENV"

      - name: Checkout official Codex source
        run: |
          git clone https://github.com/openai/codex.git codex
          cd codex
          git checkout 82e6bacb9c6950d3b56cb153847fa80bdd698053
          echo "Codex source commit: $(git rev-parse HEAD)"

      - name: Enable vendored OpenSSL for Android target
        shell: bash
        run: |
          # Codex's HTTP client depends directly on native-tls; its vendored
          # feature enables openssl-sys/vendored for this cross-compile.
          sed -i 's/^native-tls = "0.2"$/native-tls = { version = "0.2", features = ["vendored"] }/' codex/codex-rs/http-client/Cargo.toml
          grep -F 'native-tls = { version = "0.2", features = ["vendored"] }' codex/codex-rs/http-client/Cargo.toml

      - name: Apply Android compatibility patch to MXC dependency
        shell: bash
        run: |
          git clone https://github.com/microsoft/mxc.git mxc
          cd mxc
          git checkout b21120168d70befe12356411423266bfef168446
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mxc/src/mxc-sdk/src/core/mxc_engine/dispatch.rs")
          s = p.read_text()
          old = "    crate::mxc_engine::run::log_policy_hash(request, logger);"
          new = """    #[cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))]
          crate::mxc_engine::run::log_policy_hash(request, logger);"""
          assert s.count(old) == 2, f"expected two run::log_policy_hash calls, found {s.count(old)}"
          p.write_text(s.replace(old, new))
          manifest = Path("codex/codex-rs/Cargo.toml")
          cargo = manifest.read_text()
          patch = '''
          [patch."https://github.com/microsoft/mxc"]
          mxc-sdk = { path = "../../mxc/src/mxc-sdk" }
          '''
          assert '[patch."https://github.com/microsoft/mxc"]' not in cargo
          manifest.write_text(cargo + patch)
          PY
          grep -n -B1 -A1 'mxc_engine::run::log_policy_hash' mxc/src/mxc-sdk/src/core/mxc_engine/dispatch.rs

      - name: Patch unsupported Android file-lock APIs in Codex
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Android's Rust std target does not implement File::try_lock / try_lock_shared.
          # The embedded App Server is single-instance per SheV process, so Android uses
          # process ownership and retains lock files/guards without unsupported OS locks.
          p = Path("codex/codex-rs/arg0/src/lib.rs")
          s = p.read_text()
          old = "    lock_file.try_lock()?;"
          new = """    #[cfg(not(target_os = "android"))]
              lock_file.try_lock()?;
              // On Android the app owns one embedded App Server process; keep the
              // lock file alive with Arg0PathEntryGuard without unsupported std file locks."""
          assert s.count(old) == 1, "arg0 lock call changed"
          p.write_text(s.replace(old, new))

          p = Path("codex/codex-rs/file-system/src/local_logs.rs")
          s = p.read_text()
          s = s.replace("#[cfg(unix)]\n    _cleanup_lock: std::fs::File,", "#[cfg(all(unix, not(target_os = \"android\")))]\n    _cleanup_lock: std::fs::File,")
          old = """                    #[cfg(unix)]
                    let directory = {
                        use std::os::unix::fs::MetadataExt;

                        let directory = std::fs::File::open(&path)?;
                        directory.try_lock_shared()?;
                        let locked = directory.metadata()?;
                        let current = std::fs::metadata(&path)?;
                        if !locked.is_dir()
                            || (current.dev(), current.ino()) != (locked.dev(), locked.ino())
                        {
                            return Err(io::Error::new(
                                io::ErrorKind::NotFound,
                                "log directory changed during initialization",
                            ));
                        }
                        directory
                    };"""
          new = """                    #[cfg(all(unix, not(target_os = "android")))]
                    let directory = {
                        use std::os::unix::fs::MetadataExt;

                        let directory = std::fs::File::open(&path)?;
                        directory.try_lock_shared()?;
                        let locked = directory.metadata()?;
                        let current = std::fs::metadata(&path)?;
                        if !locked.is_dir()
                            || (current.dev(), current.ino()) != (locked.dev(), locked.ino())
                        {
                            return Err(io::Error::new(
                                io::ErrorKind::NotFound,
                                "log directory changed during initialization",
                            ));
                        }
                        directory
                    };"""
          assert s.count(old) == 1, "local log shared lock block changed"
          s = s.replace(old, new)
          s = s.replace("#[cfg(unix)]\n                        _cleanup_lock: directory,", "#[cfg(all(unix, not(target_os = \"android\")))]\n                        _cleanup_lock: directory,")
          p.write_text(s)

          p = Path("codex/codex-rs/rollout/src/writer_lock.rs")
          s = p.read_text()
          marker = "const COORDINATION_LOCK_FILE: &str = \".coordination.lock\";"
          helpers = marker + """

          // Android's Rust std target reports Unsupported for advisory File locks.
          // SheV embeds a single App Server process per app process, so retain the
          // lock-file lifetime but rely on the host's single-instance ownership.
          fn try_lock_exclusive(file: &File) -> Result<(), fs::TryLockError> {
              #[cfg(target_os = "android")]
              { let _ = file; Ok(()) }
              #[cfg(not(target_os = "android"))]
              { std::fs::File::try_lock(file) }
          }

          fn try_lock_shared(file: &File) -> Result<(), fs::TryLockError> {
              #[cfg(target_os = "android")]
              { let _ = file; Ok(()) }
              #[cfg(not(target_os = "android"))]
              { std::fs::File::try_lock_shared(file) }
          }
          """
          assert s.count(marker) == 1, "writer lock insertion point changed"
          s = s.replace(marker, helpers)
          s = re.sub(r"([A-Za-z_][A-Za-z0-9_]*)\.try_lock_shared\(\)", r"try_lock_shared(&\\1)", s)
          s = re.sub(r"([A-Za-z_][A-Za-z0-9_]*)\.try_lock\(\)", r"try_lock_exclusive(&\\1)", s)
          assert ".try_lock()" not in s and ".try_lock_shared()" not in s, "unexpected unpatched writer lock call remains"
          p.write_text(s)
          PY

      - name: Cache Rust Android build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex/codex-rs -> target
          shared-key: codex-android-arm64-rust-1.95

      - name: Build official Codex App Server for Android ARM64
        working-directory: codex/codex-rs
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --target aarch64-linux-android --bin codex-app-server -p codex-app-server

      - name: Inspect Android executable
        run: |
          file codex/codex-rs/target/aarch64-linux-android/release/codex-app-server
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h codex/codex-rs/target/aarch64-linux-android/release/codex-app-server | head -30

      - name: Upload Android ARM64 App Server
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-server-android-arm64
          path: codex/codex-rs/target/aarch64-linux-android/release/codex-app-server
          if-no-files-found: error
          retention-days: 14

name: Codex App Server Android cross-build

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/codex-app-server-android-native"
  pull_request:
    paths:
      - ".github/workflows/codex-android-runtime.yml"

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout SheV Agent
        uses: actions/checkout@v4

      - name: Install Android SDK and pinned NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Ensure Android Rust standard library is installed
        run: rustup target add aarch64-linux-android --toolchain stable

      - name: Configure Android linker
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384" >> "$GITHUB_ENV"

      - name: Checkout official Codex source
        run: |
          git clone https://github.com/openai/codex.git codex
          cd codex
          git checkout 82e6bacb9c6950d3b56cb153847fa80bdd698053
          echo "Codex source commit: $(git rev-parse HEAD)"

      - name: Build official Codex App Server for Android ARM64
        working-directory: codex/codex-rs
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: cargo build --release --target aarch64-linux-android --bin codex-app-server -p codex-app-server

      - name: Inspect Android executable
        run: |
          file codex/codex-rs/target/aarch64-linux-android/release/codex-app-server
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h codex/codex-rs/target/aarch64-linux-android/release/codex-app-server | head -30

      - name: Upload Android ARM64 App Server
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-server-android-arm64
          path: codex/codex-rs/target/aarch64-linux-android/release/codex-app-server
          if-no-files-found: error
          retention-days: 14

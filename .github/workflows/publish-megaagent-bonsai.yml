name: Publish MegaAgent Bonsai Android APK

on:
  workflow_dispatch:
  push:
    branches: [megaagent/mega-core-foundation]
    paths:
      - ".github/workflows/publish-megaagent-bonsai.yml"
      - "android/**"

permissions:
  contents: write

concurrency:
  group: megaagent-bonsai-apk
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Test, package and publish Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout MegaAgent branch
        uses: actions/checkout@v4
        with:
          ref: megaagent/mega-core-foundation

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shev-agent-debug-keystore-v1

      - name: Allocate next versionCode and release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts").read_text()
          version = re.search(r'versionName = "([^"]+)"', gradle).group(1)
          baseline = int(re.search(r'getOrElse\((\d+)\)', gradle).group(1))
          releases = json.loads(subprocess.check_output(
              ["gh", "api", "repos/" + os.environ["GITHUB_REPOSITORY"] + "/releases?per_page=100"],
              text=True))
          codes = []
          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue
              match = re.search(r"(?im)^versionCode:\s*(\d+)\s*$", release.get("body") or "")
              if match:
                  codes.append(int(match.group(1)))
          if not codes:
              raise SystemExit("Cannot determine the last published Android versionCode.")
          previous = max(codes)
          next_code = max(previous, baseline) + 2
          tag = f"v{version}-build.{next_code}"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"APP_VERSION={version}\nAPP_VERSION_CODE={next_code}\nPREVIOUS_VERSION_CODE={previous}\nRELEASE_TAG={tag}\n")
          print(f"Publishing {tag}, versionCode={next_code}")
          PY

      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon -PSHEV_VERSION_CODE="$APP_VERSION_CODE" testDebugUnitTest --stacktrace

      - name: Build installable debug-signed APK
        working-directory: android
        run: gradle --no-daemon -PSHEV_VERSION_CODE="$APP_VERSION_CODE" assembleDebug --stacktrace

      - name: Verify APK package, version and signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.shev.agent'"
          echo "$BADGING" | grep -q "versionCode='$APP_VERSION_CODE'"
          "$APKSIGNER" verify --verbose "$APK"
          echo "Verified package, versionCode and APK signature."

      - name: Prepare release package
        run: |
          mkdir -p release-package
          cp android/app/build/outputs/apk/debug/app-debug.apk release-package/MegaAgent-Bonsai-Android.apk
          cd release-package
          sha256sum MegaAgent-Bonsai-Android.apk > MegaAgent-Bonsai-Android.apk.sha256
          printf 'versionName=%s\nversionCode=%s\ncommit=%s\nmodel=Ternary Bonsai 2 9B (in-app download)\n' "$APP_VERSION" "$APP_VERSION_CODE" "$(git -C .. rev-parse HEAD)" > build-info.txt

      - name: Publish MegaAgent preview release
        uses: softprops/action-gh-release@v2
        with:
          name: MegaAgent Bonsai Android ${{ env.APP_VERSION }} (build ${{ env.APP_VERSION_CODE }})
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: megaagent/mega-core-foundation
          prerelease: true
          make_latest: false
          body: |
            MegaAgent Android preview with in-app Ternary Bonsai 2 9B installer.

            versionName: ${{ env.APP_VERSION }}
            versionCode: ${{ env.APP_VERSION_CODE }}
            Previous stable versionCode: ${{ env.PREVIOUS_VERSION_CODE }}

            Install the attached APK on Android ARM64. Open Settings → Local model → Ternary Bonsai 2 9B to download the model and runtime. The GGUF is downloaded on demand and is not embedded in the APK.
          files: |
            release-package/MegaAgent-Bonsai-Android.apk
            release-package/MegaAgent-Bonsai-Android.apk.sha256
            release-package/build-info.txt
          fail_on_unmatched_files: true

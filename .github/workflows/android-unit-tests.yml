name: SheV Agent Android unit tests

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-unit-tests.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-unit-tests.yml"

permissions:
  contents: read

concurrency:
  group: shev-agent-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Android JVM unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run complete Android JVM unit test suite
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

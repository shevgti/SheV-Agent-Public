name: VV Android Emulator Diagnostics

on:
  push:
    paths:
      - '.github/workflows/vv-emulator-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-16-boot:
    name: Boot Android 16 emulator and collect diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install emulator image and tools
        run: |
          sdkmanager --install "platform-tools" "emulator" "platforms;android-36" "system-images;android-36;google_apis;x86_64"
          yes | sdkmanager --licenses >/dev/null
      - name: Boot emulator and verify Android is ready
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euxo pipefail
            adb devices -l
            adb wait-for-device
            for i in $(seq 1 60); do
              BOOT="$(adb shell getprop sys.boot_completed | tr -d '\r')"
              if [ "$BOOT" = "1" ]; then break; fi
              sleep 5
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb shell wm size
            adb shell wm density
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vv-android16-emulator-diagnostics
          path: ${{ runner.temp }}/
          if-no-files-found: ignore
          retention-days: 7
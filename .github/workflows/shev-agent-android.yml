name: SheV Agent Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/shev-agent-android.yml'
      - 'docs/AGENTS.md'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/shev-agent-android.yml'
      - 'docs/AGENTS.md'
  workflow_dispatch:
    inputs:
      run_emulator:
        description: 'Run the optional Android emulator smoke test'
        required: false
        default: false
        type: boolean

concurrency:
  group: shev-agent-android-v2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shev-agent-debug-keystore-v1
      - name: Install compile SDK and build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run unit tests
        working-directory: android
        env:
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
        run: gradle testDebugUnitTest --stacktrace
      - name: Allocate next Android versionCode
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts").read_text()
          configured = re.search(r"getOrElse\((\d+)\)", gradle_file)
          if not configured:
              raise SystemExit("Cannot read baseline versionCode from app/build.gradle.kts")
          baseline = int(configured.group(1))
          raw = subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=100"],
              text=True,
          )
          releases = [
              item for item in json.loads(raw)
              if not item.get("draft") and not item.get("prerelease")
          ]
          if not releases:
              raise SystemExit("No published release found; refusing to guess previous versionCode.")
          releases.sort(key=lambda item: item.get("published_at") or item.get("created_at") or "", reverse=True)
          match = re.search(r"(?im)^versionCode:\s*(\d+)\s*$", releases[0].get("body") or "")
          if not match:
              raise SystemExit("Latest published release has no versionCode; refusing unsafe APK version.")
          previous = int(match.group(1))
          next_code = max(baseline, previous) + 1
          if next_code > 2_100_000_000:
              raise SystemExit("Android versionCode limit reached.")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"APP_VERSION_CODE={next_code}\n")
              env.write(f"PREVIOUS_VERSION_CODE={previous}\n")
          print(f"Previous published versionCode: {previous}")
          print(f"Allocated versionCode: {next_code}")
          PY
      - name: Assemble debug APK with injected versionCode
        working-directory: android
        env:
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
        run: gradle -PSHEV_VERSION_CODE="$APP_VERSION_CODE" assembleDebug
      - name: Verify APK contains Codex ARM64 runtime and versionCode
        working-directory: android
        run: |
          ACTUAL_CODE=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)
          test "$ACTUAL_CODE" = "$APP_VERSION_CODE"
          test "$ACTUAL_CODE" -gt "$PREVIOUS_VERSION_CODE"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/arm64-v8a/libcodex_app_server.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/arm64-v8a/libc++_shared.so"
          echo "Gradle versionCode verified: $ACTUAL_CODE > $PREVIOUS_VERSION_CODE"
      - name: Assemble debug APK with injected versionCode
        working-directory: android
        env:
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
        run: gradle -PSHEV_VERSION_CODE="$APP_VERSION_CODE" assembleDebug
      - name: Verify APK versionCode
        working-directory: android
        run: |
          ACTUAL_CODE=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)
          test "$ACTUAL_CODE" = "$APP_VERSION_CODE"
          test "$ACTUAL_CODE" -gt "$PREVIOUS_VERSION_CODE"
          echo "Gradle versionCode verified: $ACTUAL_CODE > $PREVIOUS_VERSION_CODE"
      - name: Prepare debug test package
        working-directory: android
        run: |
          mkdir -p ../shev-agent-package
          cp app/build/outputs/apk/debug/app-debug.apk ../shev-agent-package/
          cp shevchat/build/outputs/apk/debug/shevchat-debug.apk ../shev-agent-package/shev-chat-debug.apk
          VERSION=$(grep -oP 'versionName = "\\K[^"]+' app/build.gradle.kts)
          CHAT_VERSION=$(grep -oP 'versionName = "\\K[^"]+' shevchat/build.gradle.kts)
          test -n "$VERSION"
          test -n "$CHAT_VERSION"
          printf 'agentVersion=%s\\nchatVersion=%s\\ncommit=%s\\nrun=%s\\n' "$VERSION" "$CHAT_VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID" > ../shev-agent-package/build-info.txt
          cd ../shev-agent-package
          sha256sum app-debug.apk > app-debug.apk.sha256
          sha256sum shev-chat-debug.apk > shev-chat-debug.apk.sha256
      - name: Upload debug test package
        uses: actions/upload-artifact@v4
        with:
          name: shev-agent-debug
          path: shev-agent-package/*
          if-no-files-found: error
          retention-days: 7

  android-16-emulator:
    name: Optional Android 16 (API 36) instrumentation smoke test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_emulator == true }}
    needs: build-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install compile SDK for emulator build
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run Android 16 emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            cd android
            gradle connectedDebugAndroidTest
            mkdir -p ../shev-agent-ui-preview
            adb pull /sdcard/Android/data/com.shev.agent/files/shev-agent-home.png ../shev-agent-ui-preview/shev-agent-home.png
      - name: Upload actual Android emulator UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: shev-agent-ui-preview
          path: shev-agent-ui-preview/shev-agent-home.png
          if-no-files-found: error

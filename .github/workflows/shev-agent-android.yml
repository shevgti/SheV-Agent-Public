name: SheV Agent + SheV Chat Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/shev-agent-android.yml'
      - 'docs/AGENTS.md'
      - 'docs/SHEV_CHAT_PRODUCT_ARCHITECTURE.md'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/shev-agent-android.yml'
      - 'docs/AGENTS.md'
      - 'docs/SHEV_CHAT_PRODUCT_ARCHITECTURE.md'
  workflow_dispatch:
    inputs:
      run_emulator:
        description: 'Run Android 16 app launch smoke test'
        required: false
        default: true
        type: boolean

concurrency:
  group: shev-agent-chat-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    name: Unit tests and both debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shev-agent-debug-keystore-v1
      - name: Install compile SDK and build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run unit tests
        working-directory: android
        env:
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace 2>&1 | tee ../gradle-unit-tests.log
      - name: Allocate next SheV Agent versionCode
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts").read_text()
          configured = re.search(r"getOrElse\((\d+)\)", gradle_file)
          if not configured:
              raise SystemExit("Cannot read baseline versionCode from app/build.gradle.kts")
          baseline = int(configured.group(1))
          raw = subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=100"],
              text=True,
          )
          releases = [
              item for item in json.loads(raw)
              if not item.get("draft") and not item.get("prerelease")
          ]
          if not releases:
              raise SystemExit("No published release found; refusing to guess previous versionCode.")
          releases.sort(key=lambda item: item.get("published_at") or item.get("created_at") or "", reverse=True)
          match = re.search(r"(?im)^versionCode:\s*(\d+)\s*$", releases[0].get("body") or "")
          if not match:
              raise SystemExit("Latest release has no versionCode; refusing unsafe APK version.")
          previous = int(match.group(1))
          next_code = max(baseline, previous) + 1
          if next_code > 2_100_000_000:
              raise SystemExit("Android versionCode limit reached.")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"APP_VERSION_CODE={next_code}\n")
              env.write(f"PREVIOUS_VERSION_CODE={previous}\n")
          print(f"Previous published versionCode: {previous}")
          print(f"Allocated versionCode: {next_code}")
          PY
      - name: Assemble both debug APKs
        working-directory: android
        env:
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
        run: |
          set -o pipefail
          gradle -PSHEV_VERSION_CODE="$APP_VERSION_CODE" assembleDebug --stacktrace 2>&1 | tee ../gradle-assemble.log
      - name: Verify SheV Agent APK versionCode
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ACTUAL_CODE=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          test "$ACTUAL_CODE" = "$APP_VERSION_CODE"
          test "$ACTUAL_CODE" -gt "$PREVIOUS_VERSION_CODE"
          echo "SheV Agent versionCode=$ACTUAL_CODE > $PREVIOUS_VERSION_CODE"
      - name: Verify standalone SheV Chat APK identity and signature
        working-directory: android
        run: |
          APK="shevchat/build/outputs/apk/debug/shevchat-debug.apk"
          BADGING=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.shev.chat' versionCode='1' versionName='0.1.0'"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"
      - name: Prepare both APK artifacts
        working-directory: android
        run: |
          mkdir -p ../shev-agent-package
          cp app/build/outputs/apk/debug/app-debug.apk ../shev-agent-package/
          cp shevchat/build/outputs/apk/debug/shevchat-debug.apk ../shev-agent-package/
          AGENT_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CHAT_VERSION=$(grep -oP 'versionName = "\K[^"]+' shevchat/build.gradle.kts)
          CHAT_CODE=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging shevchat/build/outputs/apk/debug/shevchat-debug.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          printf 'agentVersion=%s\nagentVersionCode=%s\nchatVersion=%s\nchatVersionCode=%s\npreviousAgentVersionCode=%s\ncommit=%s\nrun=%s\n' "$AGENT_VERSION" "$APP_VERSION_CODE" "$CHAT_VERSION" "$CHAT_CODE" "$PREVIOUS_VERSION_CODE" "$GITHUB_SHA" "$GITHUB_RUN_ID" > ../shev-agent-package/build-info.txt
          cd ../shev-agent-package
          sha256sum app-debug.apk > app-debug.apk.sha256
          sha256sum shevchat-debug.apk > shevchat-debug.apk.sha256
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shev-chat-gradle-diagnostics
          path: |
            gradle-unit-tests.log
            gradle-assemble.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload both debug APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: shev-agent-and-chat-debug
          path: shev-agent-package/*
          if-no-files-found: error
          retention-days: 14

  android-16-emulator:
    name: Android 16 SheV Chat launch smoke test
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_emulator == true) }}
    needs: build-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install emulator SDK
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Download SheV Chat APK
        uses: actions/download-artifact@v4
        with:
          name: shev-agent-and-chat-debug
          path: test-package
      - name: Launch SheV Chat on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            # Wait for Package Manager to become responsive; emulator boot can finish before system services settle.
            for attempt in 1 2 3 4 5; do
              if adb shell cmd package list packages >/dev/null 2>&1; then
                break
              fi
              echo "Package Manager not ready (attempt $attempt); waiting..."
              sleep 10
            done
            adb shell cmd package list packages >/dev/null
            # Avoid adb's streaming install path, which intermittently fails with Broken pipe on API 36.
            adb install --no-streaming -r test-package/shevchat-debug.apk
            adb shell am start -n com.shev.chat/.ChatActivity
            sleep 5
            adb shell pidof com.shev.chat
            adb exec-out screencap -p > shev-chat-home.png
      - name: Upload SheV Chat launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: shev-chat-android-16-smoke
          path: shev-chat-home.png
          if-no-files-found: error
          retention-days: 7

name: SheV Agent Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/shev-agent-android.yml'
      - '.github/workflows/codex-android-runtime.yml'
      - '.github/workflows/publish-update.yml'
      - 'docs/AGENTS.md'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/shev-agent-android.yml'
      - '.github/workflows/codex-android-runtime.yml'
      - 'docs/AGENTS.md'
  workflow_dispatch:
    inputs:
      run_emulator:
        description: 'Run the optional Android emulator smoke test'
        required: false
        default: false
        type: boolean

concurrency:
  group: shev-agent-android-v2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-codex-runtime:
    name: Build official Codex App Server for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout SheV Agent
        uses: actions/checkout@v4
      - name: Install Android SDK and pinned NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"
      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Verify Android Rust target
        run: |
          rustup target add aarch64-linux-android
          rustup show active-toolchain
          rustup target list --installed | grep -Fxq aarch64-linux-android
      - name: Configure Android linker
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384" >> "$GITHUB_ENV"
      - name: Checkout pinned official Codex source
        run: |
          git clone https://github.com/openai/codex.git codex
          cd codex
          git checkout 82e6bacb9c6950d3b56cb153847fa80bdd698053
          echo "Codex source commit: $(git rev-parse HEAD)"
      - name: Build official Codex App Server for Android ARM64
        working-directory: codex/codex-rs
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: cargo build --release --target aarch64-linux-android --bin codex-app-server -p codex-app-server
      - name: Verify Android executable
        run: |
          BINARY="codex/codex-rs/target/aarch64-linux-android/release/codex-app-server"
          test -s "$BINARY"
          file "$BINARY"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$BINARY" | grep -E 'Class:|Machine:'
      - name: Upload Android ARM64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-server-android-arm64
          path: codex/codex-rs/target/aarch64-linux-android/release/codex-app-server
          if-no-files-found: error
          retention-days: 7

  build-and-unit-tests:
    name: Unit tests and debug APK
    needs: build-codex-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Codex Android runtime
        uses: actions/download-artifact@v4
        with:
          name: codex-app-server-android-arm64
          path: codex-runtime
      - name: Package Codex runtime into Android APK
        working-directory: android
        run: |
          test -s ../codex-runtime/codex-app-server
          mkdir -p app/src/main/jniLibs/arm64-v8a
          install -m 0755 ../codex-runtime/codex-app-server app/src/main/jniLibs/arm64-v8a/libcodex_app_server.so
          file app/src/main/jniLibs/arm64-v8a/libcodex_app_server.so
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shev-agent-debug-keystore-v1
      - name: Install compile SDK and build tools
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run unit tests
        working-directory: android
        env:
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
        run: gradle testDebugUnitTest --stacktrace
      - name: Assemble debug APK with injected versionCode
        working-directory: android
        env:
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
          SHEV_VERSION_CODE: "22"
        run: gradle -PSHEV_VERSION_CODE="$SHEV_VERSION_CODE" assembleDebug
      - name: Verify APK contains Codex ARM64 runtime and versionCode
        working-directory: android
        run: |
          ACTUAL_CODE=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)
          test "$ACTUAL_CODE" = "22"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/arm64-v8a/libcodex_app_server.so"
          echo "Gradle versionCode verified: $ACTUAL_CODE"
      - name: Prepare debug test package
        working-directory: android
        run: |
          mkdir -p ../shev-agent-package
          cp app/build/outputs/apk/debug/app-debug.apk ../shev-agent-package/
          VERSION=$(grep -oP 'versionName = "\\K[^"]+' app/build.gradle.kts)
          printf 'version=%s\\nversionCode=22\\ncommit=%s\\nrun=%s\\n' "$VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID" > ../shev-agent-package/build-info.txt
          cd ../shev-agent-package
          sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Upload debug test package
        uses: actions/upload-artifact@v4
        with:
          name: shev-agent-debug
          path: shev-agent-package/*
          if-no-files-found: error
          retention-days: 7

  android-16-emulator:
    name: Optional Android 16 (API 36) instrumentation smoke test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_emulator == true }}
    needs: build-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install compile SDK for emulator build
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run Android 16 emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            cd android
            gradle connectedDebugAndroidTest
            mkdir -p ../shev-agent-ui-preview
            adb pull /sdcard/Android/data/com.shev.agent/files/shev-agent-home.png ../shev-agent-ui-preview/shev-agent-home.png
      - name: Upload actual Android emulator UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: shev-agent-ui-preview
          path: shev-agent-ui-preview/shev-agent-home.png
          if-no-files-found: error
